# Global defaults for origin requests
originRequest:

#   # TLS behavior
  noTLSVerify: true          
  originServerName: ${fqdn}  # must match TFE's certificate CN/SAN
  tlsTimeout: 30s

# You can omit originRequest here since it inherits from the global section
ingress:
  - hostname: ${fqdn}
    service: https://terraform-enterprise:443
  - hostname: admin-${fqdn}                        # cloudflare cannot use subdomains. Do not try admin.sub.domain.com
    service: https://terraform-enterprise:8446    
  - hostname: mcp-${fqdn}
    service: http://tfe-terraform-mcp:8080
  # Catch-all rule must be last
  - service: http_status:404